<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>View Students</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">👨‍🎓 Student List</h2>
    <form method="GET" action="/view_students" class="mb-4">

    <div class="input-group">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search by Name or Email">

        <button class="btn btn-primary">
            Search
        </button>

    </div>

</form>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Actions</th>
            </tr>
        </thead>

        <tbody>

        {% for student in students %}

        <tr>
            <td>{{ student[0] }}</td>
            <td>{{ student[1] }}</td>
            <td>{{ student[2] }}</td>
            <td>{{ student[3] }}</td>
            <td>
                <a href="/edit_student/{{ student[0] }}" class="btn btn-warning btn-sm">
                    Edit
                </a>

                <a href="/delete_student/{{ student[0] }}" class="btn btn-danger btn-sm">
                    Delete
                </a>
            </td>
        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
