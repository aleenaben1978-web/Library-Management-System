<!DOCTYPE html>
<html lang="en">
<head>
    <title>Issued Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="mb-4 text-center">📚 Issued Books</h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Student</th>
                <th>Book</th>
                <th>Issue Date</th>
                <th>Return Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

        {% for book in issued %}

        <tr>

            <td>{{ book[0] }}</td>
            <td>{{ book[1] }}</td>
            <td>{{ book[2] }}</td>
            <td>{{ book[3] }}</td>
            <td>{{ book[4] or "Not Returned" }}</td>

            <td>

                {% if not book[4] %}
                <a href="/return_book/{{ book[0] }}"
                   class="btn btn-success btn-sm">
                    Return
                </a>
                {% else %}
                Returned
                {% endif %}

            </td>

        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
