<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Book</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow">

                <div class="card-body">

                    <h2 class="text-center mb-4">
                        ✏️ Edit Book
                    </h2>

                    <form method="POST">

                        <div class="mb-3">
                            <label>Book Title</label>
                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ book[1] }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>Author</label>
                            <input
                                type="text"
                                name="author"
                                class="form-control"
                                value="{{ book[2] }}"
                                required>
                        </div>

                        <div class="mb-3">
                            <label>ISBN</label>
                            <input
                                type="text"
                                name="isbn"
                                class="form-control"
                                value="{{ book[3] }}">
                        </div>

                        <div class="mb-3">
                            <label>Quantity</label>
                            <input
                                type="number"
                                name="quantity"
                                class="form-control"
                                value="{{ book[4] }}">
                        </div>

                        <button class="btn btn-success w-100">
                            Update Book
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
