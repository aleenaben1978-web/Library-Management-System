<!DOCTYPE html>
<html lang="en">
<head>
    <title>View Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <h2 class="text-center mb-4">📚 Book List</h2>
    <form method="GET" action="/view_books" class="mb-4">

    <div class="input-group">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search by Title or Author">

        <button class="btn btn-primary">
            Search
        </button>

    </div>

</form>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>ISBN</th>
                <th>Quantity</th>
                <th>Actions</th>
                </tr>
    </thead>

        <tbody>

        {% for book in books %}

        <tr>
             <td>{{ book[0] }}</td>
             <td>{{ book[1] }}</td>
            <td>{{ book[2] }}</td>
            <td>{{ book[3] }}</td>
            <td>{{ book[4] }}</td>

            <td>
                <a href="/edit_book/{{ book[0] }}" class="btn btn-warning btn-sm">
                    Edit
                </a>

                 <a href="/delete_book/{{ book[0] }}" class="btn btn-danger btn-sm">
                     Delete
                </a>
             </td>
        </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

</body>
</html>
